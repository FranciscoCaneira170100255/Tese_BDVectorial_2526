services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16-bookworm
    container_name: pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectordb
    shm_size: '4gb'
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    mem_limit: 8G
    memswap_limit: 8G
    cpus: "4"
    restart: unless-stopped

volumes:
  pgvector_data:
